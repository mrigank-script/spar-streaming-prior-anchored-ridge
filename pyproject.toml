[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aal"
version = "0.1.0"
description = "Anchored Analytic Learning: backprop-free closed-form streaming models"
requires-python = ">=3.10"
# Core runtime dependencies only; the full script/benchmark/test dependencies
# (sympy, pyriemann, mne, moabb, pytest, ...) live in requirements.txt.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "jax>=0.11",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["core", "dataio", "runner"]
